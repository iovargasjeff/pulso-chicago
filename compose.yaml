services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: pulso
      CLICKHOUSE_PASSWORD: pulso-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "pulso", "--password", "pulso-local", "--query", "SELECT 1"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  clickhouse:
