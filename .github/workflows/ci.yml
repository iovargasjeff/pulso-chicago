name: Validación
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose up -d --wait
      - run: RUN_CLICKHOUSE_TESTS=1 python -m pytest -q

  deploy:
    name: Publicar en Dokploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pulso-chicago-production
    steps:
      - name: Solicitar despliegue de main
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.PULSO_DOKPLOY_WEBHOOK }}
        run: |
          test -n "$DOKPLOY_WEBHOOK"
          status="$(curl --silent --show-error --max-time 45 --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --header 'X-GitHub-Event: push' \
            --data-binary "@$GITHUB_EVENT_PATH" "$DOKPLOY_WEBHOOK")"
          test "$status" = 200
          echo "Dokploy aceptó el despliegue de $GITHUB_SHA."
